version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:10000"
    environment:
      - PORT=10000
      - VITE_API_BASE=http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:10000"
    environment:
      - PORT=10000
      - ASPNETCORE_ENVIRONMENT=Development
      - SCHEMEREADY_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SCHEMEREADY_JWT_SIGNING_KEY=SchemeReady_DevSecretKey_32CharactersMinimum!
      - SCHEMEREADY_JWT_ISSUER=SchemeReadyApi
      - SCHEMEREADY_JWT_AUDIENCE=SchemeReadyClient
      - SCHEMEREADY_DOCUMENT_ROOT=/app/data/documents
      - SCHEMEREADY_DB_CONNECTION=Host=db;Port=5432;Database=schemeready;Username=postgres;Password=postgres
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=schemeready
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
